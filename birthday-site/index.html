<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ PASSWORD LOCK SCREEN ============ -->
  <div id="lockScreen">
    <div id="lockBox">
      <h1>Enter the password<br>for your surprise</h1>
      <input id="pwInput" type="password" placeholder="password" autocomplete="off">
      <button id="unlockBtn">Unlock 🎁</button>
      <div id="lockError"></div>
    </div>
  </div>

  <!-- ============ MAIN SITE ============ -->
  <div id="site">
    <button id="musicBtn" title="Play music">🎵</button>
    <div id="musicHint">tap for music</div>
    <audio id="bgMusic" loop preload="none">
      <source src="audio/song.mp3" type="audio/mpeg">
    </audio>

    <div id="stage">
      <h1 id="hbTitle">Happy Birthday!</h1>
    </div>

    <div id="grass"></div>

    <footer>made with 💕 just for you</footer>
  </div>

<script src="script.js"></script>
</body>
</html>
